<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05060f;
        --cyan: #35e0ff;
        --pink: #ff4fd8;
        --ink: #e8ecff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1080" data-height="1920">
      <!-- Sahneler -->
      <div id="kokpit" data-composition-id="kokpit" data-composition-src="compositions/kokpit.html"
        data-start="0" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="pencere" data-composition-id="pencere" data-composition-src="compositions/pencere.html"
        data-start="4.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html"
        data-start="9" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="rus" data-composition-id="rus" data-composition-src="compositions/rus.html"
        data-start="12.2" data-duration="3.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <!-- Gerçek oynanış kaydı (iPhone ekran kaydı) -->
      <video id="oyun-video" class="clip" src="assets/oyun.mp4" data-start="15.6" data-duration="8.4" data-media-start="0.6"
        data-track-index="1" muted style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <audio id="oyun-ses" src="assets/oyun-ses.m4a" data-start="15.6" data-duration="8.4" data-media-start="0.6" data-track-index="4" data-volume="0.35" data-fade-out="0.4"></audio>
      <div id="son" data-composition-id="son" data-composition-src="compositions/son.html"
        data-start="24" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>

      <!-- Altyazılar -->
      <div id="altyazi" data-composition-id="altyazi" data-composition-src="compositions/altyazi.html"
        data-start="0" data-duration="27" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:10"></div>

      <!-- Seslendirme: Ece (kız astronot), Kaan (erkek astronot), anlatıcı -->
      <audio id="vo-l1" src="assets/vo/l1.wav" data-start="0.25" data-duration="1.83" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l2" src="assets/vo/l2.wav" data-start="2.25" data-duration="1.89" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l3" src="assets/vo/l3.wav" data-start="4.75" data-duration="1.16" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l4" src="assets/vo/l4.wav" data-start="6.15" data-duration="1.29" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l5" src="assets/vo/l5.wav" data-start="9.35" data-duration="1.90" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l6" src="assets/vo/l6.wav" data-start="12.45" data-duration="1.73" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l7" src="assets/vo/l7.wav" data-start="16" data-duration="1.44" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l8" src="assets/vo/l8.wav" data-start="18.2" data-duration="3.39" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-l9" src="assets/vo/l9.wav" data-start="24.3" data-duration="1.51" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
