<!doctype html>
<html lang="tr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05060f;
        --cyan: #35e0ff;
        --pink: #ff4fd8;
        --ink: #e8ecff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.1" data-width="1080" data-height="1920">
      <!-- Sahneler -->
      <div id="kokpit" data-composition-id="kokpit" data-composition-src="compositions/kokpit.html"
        data-start="0" data-duration="3.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="pencere" data-composition-id="pencere" data-composition-src="compositions/pencere.html"
        data-start="3.9" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html"
        data-start="7" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <!-- Gerçek oynanış kaydı (iPhone ekran kaydı) -->
      <video id="oyun-video" class="clip" src="assets/oyun.mp4" data-start="11.5" data-duration="10.6" data-media-start="0.6"
        data-track-index="1" muted style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;z-index:1"></video>
      <div id="oyun-etiket" class="clip" data-start="11.6" data-duration="2.6" data-track-index="5"
        style="position:absolute;left:0;right:0;top:250px;text-align:center;z-index:5">
        <span id="oyun-etiket-in" style="display:inline-block;padding:12px 26px;border-radius:999px;background:rgba(5,6,18,.78);border:3px solid #35e0ff;color:#e8fbff;font:800 34px/1 Inter,sans-serif;letter-spacing:.06em">● GERÇEK OYUN İÇİ GÖRÜNTÜ</span>
      </div>
      <audio id="oyun-ses" src="assets/oyun-ses.m4a" data-start="11.5" data-duration="10.6" data-media-start="0.6" data-track-index="4" data-volume="0.35" data-fade-out="0.4"></audio>
      <div id="son" data-composition-id="son" data-composition-src="compositions/son.html"
        data-start="22.1" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>

      <!-- Altyazılar -->
      <div id="altyazi" data-composition-id="altyazi" data-composition-src="compositions/altyazi.html"
        data-start="0" data-duration="25.1" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:10"></div>

      <!-- Seslendirme: Ece (kız astronot), Kaan (erkek astronot), anlatıcı -->
      <audio id="vo-v1" src="assets/vo/v1.wav" data-start="0.12" data-duration="1.55" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v2" src="assets/vo/v2.wav" data-start="1.7" data-duration="2.28" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v3" src="assets/vo/v3.wav" data-start="4.15" data-duration="2.36" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v5" src="assets/vo/v5.wav" data-start="7.2" data-duration="3.88" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v7" src="assets/vo/v7.wav" data-start="11.75" data-duration="5.83" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v8" src="assets/vo/v8.wav" data-start="18.25" data-duration="3.38" data-track-index="3" data-volume="1"></audio>
      <audio id="vo-v9" src="assets/vo/v9.wav" data-start="22.25" data-duration="2.00" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#oyun-video", { scale: 1.0 }, { scale: 1.07, duration: 10.6, ease: "none", transformOrigin: "50% 45%" }, 11.5);
      tl.fromTo("#oyun-etiket-in", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 11.6);
      tl.to("#oyun-etiket-in", { opacity: 0, duration: 0.2, ease: "power2.in" }, 14.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
