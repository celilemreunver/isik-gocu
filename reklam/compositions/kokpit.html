  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(7);

      // kırmızı alarm nabzı (sonlu tekrar)
      tl.fromTo("#kp-alarm", { opacity: 0.9 }, { opacity: 0.25, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 10 }, 0);
      tl.fromTo("#kp-hud-in", { scale: 1 }, { scale: 1.06, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 10 }, 0);
      tl.fromTo("#kp-leds", { opacity: 1 }, { opacity: 0.35, duration: 0.21, ease: "steps(1)", yoyo: true, repeat: 21 }, 0);

      // kamera sarsıntısı: tohumlu rastgele adımlar
      let t = 0;
      while (t < 4.6) {
        const amp = t < 3.6 ? 10 : 18;
        tl.to("#kp-cam", { x: (r() - 0.5) * 2 * amp, y: (r() - 0.5) * 2 * amp, rotation: (r() - 0.5) * 0.8, duration: 0.08, ease: "none" }, t);
        t += 0.08;
      }

      // ağız hareketi: konuşma süresince tohumlu açılıp kapanma
      function talk(sel, start, end, base) {
        let k = start;
        while (k < end) {
          tl.to(sel, { scaleY: 0.35 + r() * 1.1, duration: 0.085, ease: "none", transformOrigin: "50% 50%" }, k);
          k += 0.09;
        }
        tl.to(sel, { scaleY: base, duration: 0.1, ease: "power1.out", transformOrigin: "50% 50%" }, end);
      }
      tl.set(["#kp-ece-mouth", "#kp-kaan-mouth"], { scaleY: 0.6, transformOrigin: "50% 50%" }, 0);
      talk("#kp-ece-mouth", 0.25, 2.05, 0.9);   // "Ne oluyor?! Nereye gidiyoruz?"
      talk("#kp-kaan-mouth", 2.25, 4.1, 1.1);   // "Motorlar durdu! Dışarı bak!"

      // Ece önce sağa sola panikle bakar
      tl.fromTo(["#kp-ece-pl", "#kp-ece-pr"], { x: -8 }, { x: 8, duration: 0.3, ease: "power2.inOut", yoyo: true, repeat: 5 }, 0.1);
      tl.fromTo("#kp-ece-head", { rotation: -4 }, { rotation: 4, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "50% 80%" }, 0.1);
      // Kaan konuşmaya başlarken Ece'ye döner
      tl.fromTo(["#kp-kaan-pl", "#kp-kaan-pr"], { x: 0 }, { x: 10, duration: 0.18, ease: "power2.out" }, 2.2);
      // "Dışarı bak!" ile ikisi de geriye, pencereye döner (göz yukarı)
      tl.to(["#kp-kaan-pl", "#kp-kaan-pr", "#kp-ece-pl", "#kp-ece-pr"], { y: -12, x: 0, duration: 0.2, ease: "back.out(2)" }, 3.15);
      tl.to("#kp-kaan-head", { rotation: 6, y: -10, duration: 0.3, ease: "power3.out", transformOrigin: "50% 80%" }, 3.15);
      tl.to("#kp-ece-head", { rotation: -6, y: -12, duration: 0.32, ease: "power3.out", transformOrigin: "50% 80%" }, 3.22);

      // pencereye itiş ve kesme
      tl.fromTo("#kp-svg", { scale: 1 }, { scale: 2.4, duration: 0.85, ease: "power3.in", transformOrigin: "50% 29%" }, 3.75);
      tl.to("#kp-hud", { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, 3.9);
      window.__timelines["kokpit"] = tl;
    })();
  </script>
