<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #03040b; }
    #rs-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #rs-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #rs-stamp { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
    #rs-stamp-in { display: inline-block; padding: 16px 30px; border: 5px solid #ff3b3b; border-radius: 12px; color: #ff4a4a;
      background: rgba(25,0,0,.75); font: 900 64px/1 Inter, sans-serif; letter-spacing: .04em; text-shadow: 0 0 18px rgba(255,60,60,.9); }
    #rs-stamp-sub { margin-top: 14px; color: #ffd0d0; font: 700 36px/1 'JetBrains Mono', monospace; }
  </style>
  <div id="root" data-composition-id="rus" data-width="1080" data-height="1920">
    <canvas id="rs-canvas" width="1080" height="1920"></canvas>
    <svg id="rs-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <g id="rs-ship">
        <g id="rs-ship-body">
          <!-- kanat -->
          <path d="M-60 18 L60 18 L-40 92 L-110 92 Z" fill="#d9dde8"/>
          <path d="M-110 92 L-40 92 L-30 84 L-100 84Z" fill="#222"/>
          <!-- gövde -->
          <path d="M-180 -20 L150 -20 C200 -18 230 0 240 14 C230 30 200 40 150 40 L-180 40 Z" fill="#f2f4f8"/>
          <path d="M150 28 C200 30 226 22 240 14 C232 32 200 42 150 42 L-180 42 L-180 28Z" fill="#1b1d24"/>
          <path d="M175 -12 C195 -10 210 -2 218 6 L178 6 Z" fill="#1b1d24"/>
          <!-- kuyruk -->
          <path d="M-180 -20 L-120 -20 L-150 -110 L-185 -110 Z" fill="#e8ebf2"/>
          <rect x="-178" y="-100" width="26" height="12" fill="#fff"/>
          <rect x="-176" y="-88" width="26" height="12" fill="#1c4fd6"/>
          <rect x="-174" y="-76" width="26" height="12" fill="#d52b1e"/>
          <!-- bayrak ve yazı -->
          <rect x="-110" y="-10" width="42" height="9" fill="#fff" stroke="#bbb" stroke-width="1"/>
          <rect x="-110" y="-1" width="42" height="9" fill="#1c4fd6"/>
          <rect x="-110" y="8" width="42" height="9" fill="#d52b1e"/>
          <text x="-56" y="13" font-family="Montserrat, sans-serif" font-weight="900" font-size="26" fill="#1b1d24" letter-spacing="2">РОССИЯ</text>
          <!-- motor alevi -->
          <path id="rs-flame" d="M-180 -6 L-250 10 L-180 26 Z" fill="#ffb347"/>
        </g>
      </g>
    </svg>
    <div id="rs-stamp"><div id="rs-stamp-in">✕ SİNYAL KAYBOLDU</div></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cv = document.getElementById("rs-canvas"), ctx = cv.getContext("2d");
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(11), CX = 560, CY = 860, R = 150;
      const stars = []; for (let i = 0; i < 380; i++) stars.push({ a: r() * 6.283, d: 200 + r() * 1100, s: 0.6 + r() * 2, b: 0.3 + r() * 0.7 });
      function draw(t) {
        const gulp = t < 2.2 ? 0 : t < 2.38 ? (t - 2.2) / 0.18 : Math.max(0, 1 - (t - 2.38) / 0.6);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1300);
        g.addColorStop(0, "#2b0f3e"); g.addColorStop(0.4, "#0e0620"); g.addColorStop(1, "#02030a");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
        for (const s of stars) {
          const w = 60 / s.d, a = s.a + w * t, x = CX + Math.cos(a) * s.d, y = CY + Math.sin(a) * s.d * 0.9;
          ctx.strokeStyle = `rgba(215,222,255,${s.b})`; ctx.lineWidth = s.s;
          ctx.beginPath(); ctx.moveTo(CX + Math.cos(a - w * 0.5) * s.d, CY + Math.sin(a - w * 0.5) * s.d * 0.9); ctx.lineTo(x, y); ctx.stroke();
        }
        const RR = R * (1 + 0.12 * gulp);
        const glow = ctx.createRadialGradient(CX, CY, RR * 0.8, CX, CY, RR * 3.4);
        glow.addColorStop(0, `rgba(255,150,70,${0.55 + 0.4 * gulp})`); glow.addColorStop(0.45, "rgba(170,60,255,.25)"); glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(CX, CY, RR * 3.4, 0, 6.283); ctx.fill();
        const disk = (front) => { for (let k = 0; k < 7; k++) { const rx = RR * (1.5 + k * 0.28); ctx.strokeStyle = `rgba(${k < 3 ? "255,210,140" : k < 5 ? "255,130,60" : "190,80,255"},${0.85 - k * 0.1})`; ctx.lineWidth = RR * (0.16 - k * 0.012); ctx.beginPath(); ctx.ellipse(CX, CY, rx, rx * 0.28, -0.18, front ? 0 : Math.PI, front ? Math.PI : 6.283); ctx.stroke(); } };
        disk(false);
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(CX, CY, RR, 0, 6.283); ctx.fill();
        ctx.strokeStyle = "rgba(255,225,170,.95)"; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(CX, CY, RR * 1.06, 0, 6.283); ctx.stroke();
        disk(true);
      }
      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 3.4, duration: 3.4, ease: "none", onUpdate: () => draw(st.t) }, 0);

      // mekik: önce düz uçar, sonra yakalanıp sarmalla içeri çekilir
      const ship = document.getElementById("rs-ship");
      const sp = { u: 0 };
      function pos(u) {
        // u 0..1 ; açı 200°'den başlayıp 1.6 tur döner, yarıçap 700'den 0'a
        const th = (200 + 580 * Math.pow(u, 1.25)) * Math.PI / 180;
        const rad = 720 * Math.pow(1 - u, 1.4);
        return { x: CX + Math.cos(th) * rad, y: CY + Math.sin(th) * rad * 0.62 };
      }
      function place() {
        const u = Math.min(0.999, sp.u), a = pos(u), b = pos(Math.min(1, u + 0.004));
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        const pull = Math.pow(u, 3);
        const s = 1.25 * (1 - 0.92 * pull);
        ship.setAttribute("transform", `translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${(s * (1 + 2.4 * pull)).toFixed(3)} ${(s * (1 - 0.7 * pull)).toFixed(3)})`);
        ship.setAttribute("opacity", u > 0.97 ? 0 : 1);
      }
      tl.fromTo(sp, { u: 0 }, { u: 1, duration: 2.25, ease: "power2.in", onUpdate: place }, 0);
      place();
      tl.fromTo("#rs-flame", { scaleX: 1 }, { scaleX: 0.3, duration: 0.12, yoyo: true, repeat: 7, transformOrigin: "100% 50%" }, 0);
      // yutma anı
      tl.fromTo("#rs-stamp", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, 2.25);
      draw(0);
      window.__timelines["rus"] = tl;
    })();
  </script>
</template>
