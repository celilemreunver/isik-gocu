<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #2a1a5e 0%, #0d0b2a 45%, #04050d 100%); }
    #lg-stars, #lg-art { position: absolute; inset: 0; width: 100%; height: 100%; }
    #lg-title { position: absolute; left: 0; right: 0; top: 880px; text-align: center; color: #fff;
      font: 900 150px/1 Montserrat, sans-serif; letter-spacing: .02em;
      text-shadow: 0 0 22px rgba(53,224,255,.95), 0 0 60px rgba(53,224,255,.6); }
    #lg-sub { position: absolute; left: 0; right: 0; top: 1055px; text-align: center; color: #bfefff;
      font: 700 48px/1.2 Inter, sans-serif; letter-spacing: .02em; }
    #lg-flash { position: absolute; inset: 0; background: #fff; }
  </style>
  <div id="root" data-composition-id="logo" data-width="1080" data-height="1920">
    <svg id="lg-stars" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><g id="lg-starg" fill="#fff"></g></svg>
    <svg id="lg-art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="lg-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path id="lg-path" d="M170 820 C260 720 230 640 360 600 C470 566 520 520 600 470 C650 438 680 420 700 400"
        fill="none" stroke="#5ff0ff" stroke-width="12" stroke-linecap="round" filter="url(#lg-glow)"/>
      <g id="lg-ring" transform="translate(790 330)" filter="url(#lg-glow)">
        <circle r="78" fill="none" stroke="#ff4fd8" stroke-width="16"/>
        <g fill="none" stroke="#ff4fd8" stroke-width="20" stroke-linecap="butt">
          <path d="M0 -122 A122 122 0 0 1 86 -86"/><path d="M122 0 A122 122 0 0 1 86 86"/>
          <path d="M0 122 A122 122 0 0 1 -86 86"/><path d="M-122 0 A122 122 0 0 1 -86 -86"/>
        </g>
      </g>
      <g id="lg-chev" fill="#bff8ff" filter="url(#lg-glow)">
        <path id="lg-c1" d="M-20 -14 L14 0 L-20 14 L-10 0Z"/>
        <path id="lg-c2" d="M-20 -14 L14 0 L-20 14 L-10 0Z"/>
        <path id="lg-c3" d="M-20 -14 L14 0 L-20 14 L-10 0Z"/>
      </g>
    </svg>
    <div id="lg-title">IŞIK GÖÇÜ</div>
    <div id="lg-sub">Uzay filolarını eve götür</div>
    <div id="lg-flash"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(3), sg = document.getElementById("lg-starg");
      for (let i = 0; i < 160; i++) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", (r() * 1080).toFixed(1)); c.setAttribute("cy", (r() * 1920).toFixed(1));
        c.setAttribute("r", (0.8 + r() * 2.2).toFixed(1)); c.setAttribute("opacity", (0.3 + r() * 0.7).toFixed(2));
        sg.appendChild(c);
      }
      const path = document.getElementById("lg-path");
      const L = path.getTotalLength(), N = 400, SP = [];
      for (let i = 0; i <= N; i++) { const p = path.getPointAtLength(L * i / N); SP.push([p.x, p.y]); }
      path.style.strokeDasharray = L; path.style.strokeDashoffset = L;

      tl.fromTo("#lg-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out" }, 0);
      tl.fromTo("#lg-stars", { scale: 1.25 }, { scale: 1, duration: 1.2, ease: "power3.out", transformOrigin: "50% 40%" }, 0);
      // ışık yolu çizilir
      tl.fromTo(path, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.15);
      // filolar yol boyunca akar
      ["#lg-c1", "#lg-c2", "#lg-c3"].forEach((id, i) => {
        const o = { u: 0 };
        const place = () => {
          const u = Math.min(1, Math.max(0, o.u));
          const i = Math.min(N - 1, Math.floor(u * N)), p = { x: SP[i][0], y: SP[i][1] }, q = { x: SP[i + 1][0], y: SP[i + 1][1] };
          const a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
          document.querySelector(id).setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${a})`);
          document.querySelector(id).setAttribute("opacity", u <= 0 || u >= 1 ? 0 : 1);
        };
        tl.fromTo(o, { u: 0 }, { u: 1, duration: 1.3, ease: "none", onUpdate: place }, 0.55 + i * 0.22);
        place();
      });
      // istasyon halkası
      tl.fromTo("#lg-ring", { scale: 0, rotation: -90, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(1.8)" }, 0.6);
      tl.to("#lg-ring", { rotation: 150, duration: 3.6, ease: "none" }, 1.15);
      tl.fromTo("#lg-ring", { opacity: 1 }, { opacity: 0.75, duration: 0.15, yoyo: true, repeat: 1 }, 2.0);
      // başlık
      tl.fromTo("#lg-title", { opacity: 0, scale: 1.35, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.45);
      tl.fromTo("#lg-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.9);
      tl.to(["#lg-title", "#lg-sub", "#lg-art"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 4.2);
      window.__timelines["logo"] = tl;
    })();
  </script>
</template>
