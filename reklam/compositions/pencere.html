<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #pc-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #pc-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    #pc-hud { position: absolute; left: 0; right: 0; top: 220px; text-align: center; }
    #pc-hud-t { display: inline-block; padding: 14px 28px; border: 4px solid #ff3b3b; border-radius: 12px; background: rgba(30,0,0,.7);
      color: #ff5a5a; font: 900 50px/1 Inter, sans-serif; letter-spacing: .04em; text-shadow: 0 0 16px rgba(255,60,60,.9); }
    #pc-dist { margin-top: 14px; color: #ffd0d0; font: 700 40px/1 'JetBrains Mono', monospace; letter-spacing: .06em; }
    #pc-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="pencere" data-width="1080" data-height="1920">
    <canvas id="pc-canvas" width="1080" height="1920"></canvas>
    <svg id="pc-frame" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="pc-hole">
          <rect width="1080" height="1920" fill="#fff"/>
          <rect x="70" y="170" width="940" height="1380" rx="150" fill="#000"/>
        </mask>
        <linearGradient id="pc-metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a2f48"/><stop offset="1" stop-color="#0d0f1a"/>
        </linearGradient>
      </defs>
      <rect width="1080" height="1920" fill="url(#pc-metal)" mask="url(#pc-hole)"/>
      <rect x="70" y="170" width="940" height="1380" rx="150" fill="none" stroke="#4a5378" stroke-width="10"/>
      <g fill="#59618a">
        <circle cx="40" cy="300" r="10"/><circle cx="40" cy="860" r="10"/><circle cx="40" cy="1420" r="10"/>
        <circle cx="1040" cy="300" r="10"/><circle cx="1040" cy="860" r="10"/><circle cx="1040" cy="1420" r="10"/>
      </g>
      <!-- ön planda iki kask (arkadan): pencereye bakıyorlar -->
      <g id="pc-helmets">
        <circle cx="300" cy="1790" r="260" fill="#0c0e18"/>
        <path d="M70 1700 A260 260 0 0 1 300 1530" stroke="#ff9a5c" stroke-width="8" fill="none" opacity=".8"/>
        <circle cx="800" cy="1820" r="250" fill="#0c0e18"/>
        <path d="M1030 1720 A250 250 0 0 0 800 1570" stroke="#c78cff" stroke-width="8" fill="none" opacity=".8"/>
      </g>
    </svg>
    <div id="pc-hud">
      <div id="pc-hud-t">⚠ ÇEKİM ALANI: KRİTİK</div>
      <div id="pc-dist">MESAFE: 1.240 km</div>
    </div>
    <div id="pc-flash"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const cv = document.getElementById("pc-canvas");
      const ctx = cv.getContext("2d");
      const dist = document.getElementById("pc-dist");
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const r = rng(42);
      const CX = 540, CY = 860;
      const stars = [];
      for (let i = 0; i < 520; i++) stars.push({ a: r() * Math.PI * 2, d: 140 + Math.pow(r(), 0.7) * 1100, s: 0.6 + r() * 2.2, b: 0.4 + r() * 0.6, h: r() });

      function draw(t) {
        const p = Math.min(1, t / 7.1);
        const R = 70 + 300 * Math.pow(p, 1.6);
        const sx = Math.sin(t * 53) * (4 + 14 * p), sy = Math.cos(t * 41) * (4 + 14 * p);
        ctx.setTransform(1, 0, 0, 1, sx, sy);
        const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1300);
        g.addColorStop(0, "#2a0f40"); g.addColorStop(0.35, "#120724"); g.addColorStop(1, "#02030a");
        ctx.fillStyle = g; ctx.fillRect(-60, -60, 1200, 2040);

        // yıldızlar: kara deliğe doğru dönerek düşer
        for (const st of stars) {
          const fall = Math.pow(p, 2) * 0.85 * (1.2 - st.d / 1400);
          const d = Math.max(R * 0.9, st.d * (1 - fall));
          const w = (0.15 + 3.2 * p * p) * 240 / d;
          const a = st.a + w * t * 0.6;
          const tail = Math.min(1.1, w * 0.35);
          const x1 = CX + Math.cos(a) * d, y1 = CY + Math.sin(a) * d * 0.9;
          const x0 = CX + Math.cos(a - tail) * d * 1.02, y0 = CY + Math.sin(a - tail) * d * 0.9 * 1.02;
          ctx.strokeStyle = st.h > 0.7 ? `rgba(255,190,120,${st.b})` : `rgba(210,220,255,${st.b})`;
          ctx.lineWidth = st.s; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }

        // dış parıltı
        const glow = ctx.createRadialGradient(CX, CY, R * 0.8, CX, CY, R * 3.2);
        glow.addColorStop(0, "rgba(255,140,60,.55)"); glow.addColorStop(0.4, "rgba(170,60,255,.25)"); glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(CX, CY, R * 3.2, 0, Math.PI * 2); ctx.fill();

        // toplanma diski: arka yarı
        const disk = (front) => {
          for (let k = 0; k < 7; k++) {
            const rx = R * (1.5 + k * 0.28), ry = rx * 0.28;
            const hue = k < 3 ? "255,210,140" : (k < 5 ? "255,130,60" : "190,80,255");
            ctx.strokeStyle = `rgba(${hue},${0.85 - k * 0.1})`;
            ctx.lineWidth = R * (0.16 - k * 0.012);
            ctx.beginPath();
            ctx.ellipse(CX, CY, rx, ry, -0.18, front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2);
            ctx.stroke();
          }
        };
        disk(false);
        // olay ufku
        ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
        // foton halkası (bükülmüş ışık)
        ctx.strokeStyle = "rgba(255,225,170,.95)"; ctx.lineWidth = Math.max(3, R * 0.06);
        ctx.beginPath(); ctx.arc(CX, CY, R * 1.06, 0, Math.PI * 2); ctx.stroke();
        disk(true);

        const km = Math.max(0, Math.round(1240 * (1 - Math.pow(p, 0.8))));
        dist.textContent = "MESAFE: " + km.toLocaleString("tr-TR") + " km";
      }

      const st = { t: 0 };
      tl.fromTo(st, { t: 0 }, { t: 7.6, duration: 7.6, ease: "none", onUpdate: () => draw(st.t) }, 0);
      draw(0);

      tl.fromTo("#pc-hud-t", { scale: 1 }, { scale: 1.07, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 22 }, 0);
      // kasklar öne eğilir: korku
      tl.fromTo("#pc-helmets", { y: 40 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.to("#pc-helmets", { y: 30, duration: 0.4, ease: "power2.in" }, 6.0);
      // dalış: çerçeve dağılır, beyaz flaş
      tl.to(["#pc-frame", "#pc-hud"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 6.2);
      tl.fromTo("#pc-canvas", { scale: 1 }, { scale: 3.2, duration: 1.0, ease: "power4.in", transformOrigin: "50% 44.8%" }, 6.2);
      tl.fromTo("#pc-flash", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.in" }, 7.15);
      window.__timelines["pencere"] = tl;
    })();
  </script>
</template>
